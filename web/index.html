<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- THE BULLETPROOF CHAMELEON FIX FOR SAFARI & CHROME -->
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#010126" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#010126" media="(prefers-color-scheme: dark)">

  <!-- FIX FOR THE YELLOW CONSOLE WARNING -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Zehut">

  <title>Zehut 2026</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- EXPLICIT ICON LINKS FOR DESKTOP & MOBILE BROWSERS -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- FIXED DOMAIN FOR ROOT OG IMAGE -->
  <meta property="og:image" content="https://gamfeiglintzadak.co.il/images/moshe-feiglin-gadi-eisenkot-who-is-the-real-enemy.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1080">
  <meta property="og:image:height" content="1080">

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #010126;
      overflow: hidden;
    }

    /* FORCE FLUTTER WEB TEXT FIELDS & DOM INPUTS TO MATCH DARK BACKGROUND */
    flt-text-field, input, textarea {
      background-color: transparent !important;
      color: white !important;
    }

    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus {
      -webkit-box-shadow: 0 0 0 1000px #1E293B inset !important;
      -webkit-text-fill-color: white !important;
    }
  </style>
</head>
<body>
<script>
  // Force-kill stale service workers and caches.
  // THIS IS WHAT PREVENTS THE VIDEO 206 STREAMING CRASH
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(registrations) {
      for(let registration of registrations) {
        registration.unregister();
      }
    });
  }
  if ('caches' in window) {
    caches.keys().then(function(names) {
      for (let name of names) {
        caches.delete(name);
      }
    });
  }
</script>
<script src="flutter_bootstrap.js?v=83" async></script>
</body>
</html>
